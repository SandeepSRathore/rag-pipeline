server:
  port: 8081 # 8080 is often taken by other local Spring apps
  # No auth (local learning project): listen on loopback only, so nobody on the LAN can upload, delete or
  # spend OpenAI credits through this app.
  address: 127.0.0.1

spring:
  application:
    name: rag-pipeline
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
    async:
      # Streamed answers can outlive Tomcat's 30 s default async timeout, especially with reasoning models.
      request-timeout: 5m
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5-mini}
          stream-options:
            include-usage: true
      embedding:
        # Default is EMBED, which prepends every metadata entry ("source_id: 3f2a…") to the text before
        # embedding. Chunks already carry a "Title › Section" header; IDs and counters would only add noise.
        metadata-mode: none
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: false # Flyway owns the schema: db/migration/V1__schema.sql
        dimensions: 1536
        distance-type: cosine-distance
        index-type: hnsw

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

rag:
  corpus-dir: corpus
  embedding-model: ${spring.ai.openai.embedding.options.model}
  chunking:
    max-tokens: 500
    min-tokens: 50
    overlap-tokens: 60
  retrieval:
    top-k: 5
    similarity-threshold: 0.0
    mode: hybrid          # vector | keyword | hybrid; chosen by the M4 eval (see eval/README.md)
    candidates: 20        # hybrid: chunks each retriever contributes before fusion; with rerank, the chunks it rates
    rewrite: false                # rewrite the question with the utility model first (decided by the M5 eval)
    query-variants: 0             # extra phrasings searched and fused across queries; 0 = off (M5 eval)
    utility-model: gpt-4.1-mini   # rewriting, expansion and reranking; must accept temperature 0
    rerank:
      enabled: true               # rate the candidates 0-10 with the utility model, keep the best top-k (M6 eval)
      min-score: 6                # drop candidates rated below this; none left → "I couldn't find…" (M6 eval)
  eval:
    golden-set: eval/golden-set.json         # reviewed (see eval/README.md), committed
    reports-dir: eval/reports                # gitignored
    golden:
      draft: eval/golden-set.draft.json      # gitignored; review it, then save as golden-set.json
      size: 40
      seed: 42
